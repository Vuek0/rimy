[project]
name = "rimy"
version = "0.1.0"
description = "Rimy: Telegram bot and Mini App for learning foreign words with AI flashcards and spaced repetition"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]  # so `pytest` (not only `python -m pytest`) can import the bot package
